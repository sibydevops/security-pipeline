services:
  - type: web
    name: security-pipeline-webhook
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: CENTRAL_REPOSITORY
        value: sibydevops/security-pipeline
      - key: CENTRAL_WORKFLOW_ID
        value: central-security-dispatch.yml
      - key: CENTRAL_WORKFLOW_REF
        value: main
