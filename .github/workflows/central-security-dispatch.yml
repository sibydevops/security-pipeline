name: Central Security Dispatch

on:
  workflow_dispatch:
    inputs:
      repository:
        description: 'Full name of the repository to scan'
        required: true
        type: string
      ref:
        description: 'Git ref or pull request merge ref to scan'
        required: true
        type: string
      sha:
        description: 'Event commit SHA for traceability'
        required: true
        type: string
      event:
        description: 'Source GitHub event'
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  app-token:
    name: Create scanner token
    runs-on: ubuntu-latest
    outputs:
      token: ${{ steps.token.outputs.token }}
    steps:
      - id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.SECURITY_APP_ID }}
          private-key: ${{ secrets.SECURITY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

  scan:
    name: Scan ${{ inputs.repository }}
    needs: app-token
    uses: ./.github/workflows/common-owasp-security.yml
    with:
      application-type: auto
      scan-repository: ${{ inputs.repository }}
      scan-ref: ${{ inputs.ref }}
      run-zap: true
      upload-codeql-results: false
    secrets:
      scan-token: ${{ needs.app-token.outputs.token }}
