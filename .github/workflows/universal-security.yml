name: 🔒 OWASP Enterprise Security Pipeline

on:
  pull_request:
    branches:
      - "**"

  push:
    branches:
      - main
      - master
      - develop

  schedule:
    - cron: "0 2 * * 1-5"

  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write

env:
  FAIL_CVSS_THRESHOLD: "7.0"

jobs:

  recon:
    name: 🔍 Reconnaissance
    runs-on: ubuntu-latest

    outputs:
      has_docker: ${{ steps.detect.outputs.has_docker }}
      has_terraform: ${{ steps.detect.outputs.has_terraform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Repository Type
        id: detect
        shell: bash
        run: |

          HAS_DOCKER=false
          HAS_TERRAFORM=false

          if [ -f Dockerfile ]; then
            HAS_DOCKER=true
          fi

          if find . -name "*.tf" | grep -q . ; then
            HAS_TERRAFORM=true
          fi

          echo "has_docker=${HAS_DOCKER}" >> $GITHUB_OUTPUT
          echo "has_terraform=${HAS_TERRAFORM}" >> $GITHUB_OUTPUT

  codeql:
    name: 🔍 CodeQL SAST
    runs-on: ubuntu-latest
    needs: recon

    permissions:
      contents: read
      actions: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript
          - python
          - java
          - go
          - ruby
          - csharp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Analyze
        uses: github/codeql-action/analyze@v4

  semgrep:
    name: 🔎 Semgrep
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: |
            p/security-audit
            p/owasp-top-ten
            p/secrets
            p/python
            p/java
            p/nodejs
            p/go

  gitleaks:
    name: 🔑 Secret Scanning
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2

  dependency-check:
    name: 📦 OWASP Dependency Check
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Reports Folder
        run: mkdir -p reports

      - name: Pull Dependency Check Image
        run: |
          docker pull owasp/dependency-check:latest

      - name: Run Dependency Check
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            owasp/dependency-check:latest \
            --scan /src \
            --out /src/reports \
            --format HTML \
            --format JSON \
            --failOnCVSS ${{ env.FAIL_CVSS_THRESHOLD }} \
            --nvdApiKey "${{ secrets.NVD_API_KEY }}"

      - name: Upload Dependency Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports/**
          if-no-files-found: warn

  container:
    name: 🐳 Trivy Container Security
    runs-on: ubuntu-latest

    needs:
      - recon

    if: needs.recon.outputs.has_docker == 'true'

    permissions:
      security-events: write

    steps:

      - uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t app:${{ github.sha }} .

      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: app:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-container

      - name: Upload Trivy Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-results.sarif
          if-no-files-found: warn

  terraform-security:
    name: ☁️ Terraform Security
    runs-on: ubuntu-latest

    needs:
      - recon

    if: needs.recon.outputs.has_terraform == 'true'

    steps:

      - uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3

  summary:
    name: ✅ Security Summary
    runs-on: ubuntu-latest

    needs:
      - codeql
      - semgrep
      - gitleaks
      - dependency-check

    if: always()

    steps:
      - name: Summary
        run: |
          echo "==================================="
          echo "OWASP Security Pipeline Completed"
          echo "==================================="
          echo "✓ CodeQL"
          echo "✓ Semgrep"
          echo "✓ Gitleaks"
          echo "✓ OWASP Dependency Check"
          echo "✓ Trivy (when Dockerfile exists)"
          echo "✓ Checkov (when Terraform exists)"
          echo "✓ tfsec (when Terraform exists)"