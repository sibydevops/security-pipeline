name: Universal Enterprise Security Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop

  pull_request:

  workflow_dispatch:

  schedule:
    - cron: "0 2 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:

  ###########################################################################
  # DETECT REPOSITORY TYPE
  ###########################################################################

  detect:
    runs-on: ubuntu-latest

    outputs:
      docker: ${{ steps.detect.outputs.docker }}
      terraform: ${{ steps.detect.outputs.terraform }}
      kubernetes: ${{ steps.detect.outputs.kubernetes }}
      openapi: ${{ steps.detect.outputs.openapi }}
      dotnet: ${{ steps.detect.outputs.dotnet }}
      java: ${{ steps.detect.outputs.java }}
      python: ${{ steps.detect.outputs.python }}

    steps:
      - uses: actions/checkout@v4

      - id: detect
        shell: bash
        run: |
          echo "docker=false" >> $GITHUB_OUTPUT
          echo "terraform=false" >> $GITHUB_OUTPUT
          echo "kubernetes=false" >> $GITHUB_OUTPUT
          echo "openapi=false" >> $GITHUB_OUTPUT
          echo "dotnet=false" >> $GITHUB_OUTPUT
          echo "java=false" >> $GITHUB_OUTPUT
          echo "python=false" >> $GITHUB_OUTPUT

          if find . -name "Dockerfile" | grep -q .; then
            echo "docker=true" >> $GITHUB_OUTPUT
          fi

          if find . -name "*.tf" | grep -q .; then
            echo "terraform=true" >> $GITHUB_OUTPUT
          fi

          if find . \( -name "*.yaml" -o -name "*.yml" \) | grep -q .; then
            echo "kubernetes=true" >> $GITHUB_OUTPUT
          fi

          if find . \( -name "openapi.yaml" -o -name "swagger.yaml" \) | grep -q .; then
            echo "openapi=true" >> $GITHUB_OUTPUT
          fi

          if find . \( -name "*.sln" -o -name "*.csproj" \) | grep -q .; then
            echo "dotnet=true" >> $GITHUB_OUTPUT
          fi

          if find . \( -name "*.java" -o -name "pom.xml" \) | grep -q .; then
            echo "java=true" >> $GITHUB_OUTPUT
          fi

          if find . -name "*.py" | grep -q .; then
            echo "python=true" >> $GITHUB_OUTPUT
          fi

  ###########################################################################
  # GITLEAKS
  ###########################################################################

  gitleaks:
    needs: detect
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2

  ###########################################################################
  # SEMGREP
  ###########################################################################

  semgrep:
    needs: detect
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: |
            p/owasp-top-ten
            p/security-audit
            p/secrets

  ###########################################################################
  # CODEQL JAVASCRIPT
  ###########################################################################

  codeql-javascript:
    needs: detect
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - uses: github/codeql-action/autobuild@v3

      - uses: github/codeql-action/analyze@v3

  ###########################################################################
  # CODEQL PYTHON
  ###########################################################################

  codeql-python:
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: python

      - uses: github/codeql-action/autobuild@v3

      - uses: github/codeql-action/analyze@v3

  ###########################################################################
  # CODEQL JAVA
  ###########################################################################

  codeql-java:
    needs: detect
    if: needs.detect.outputs.java == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: java

      - uses: github/codeql-action/autobuild@v3

      - uses: github/codeql-action/analyze@v3

  ###########################################################################
  # DEPENDENCY REVIEW
  ###########################################################################

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/dependency-review-action@v4

  ###########################################################################
  # OWASP DEPENDENCY CHECK
  ###########################################################################

  dependency-check:
    needs: detect
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: ${{ github.repository }}
          path: .
          format: SARIF

      - name: Upload Dependency SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/dependency-check-report.sarif

  ###########################################################################
  # TRIVY FILE SYSTEM
  ###########################################################################

  trivy-fs:
    needs: detect
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: HIGH,CRITICAL

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif

  ###########################################################################
  # TRIVY CONTAINER
  ###########################################################################

  trivy-container:
    needs: detect
    if: needs.detect.outputs.docker == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t app:${{ github.sha }} .

      - name: Trivy Container Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: app:${{ github.sha }}
          format: sarif
          output: trivy-container.sarif
          severity: HIGH,CRITICAL

      - name: Upload Container SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-container.sarif

  ###########################################################################
  # CHECKOV
  ###########################################################################

  checkov:
    needs: detect
    if: needs.detect.outputs.terraform == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Checkov Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform,kubernetes,cloudformation,bicep
          output_format: sarif
          output_file_path: checkov.sarif

      - name: Upload Checkov SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov.sarif

  ###########################################################################
  # KUBESCAPE
  ###########################################################################

  kubescape:
    needs: detect
    if: needs.detect.outputs.kubernetes == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Kubescape Scan
        uses: kubescape/github-action@main

  ###########################################################################
  # BINSKIM
  ###########################################################################

  binskim:
    needs: detect
    if: needs.detect.outputs.dotnet == 'true'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run BinSkim
        uses: microsoft/binskim-action@v1

  ###########################################################################
  # API SECURITY
  ###########################################################################

  api-security:
    needs: detect
    if: needs.detect.outputs.openapi == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Schemathesis
        run: |
          python -m pip install --upgrade pip
          pip install schemathesis

      - name: Locate OpenAPI Spec
        id: api
        shell: bash
        run: |
          FILE=$(find . \( -name "openapi.yaml" -o -name "swagger.yaml" \) | head -1)
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Run Schemathesis
        run: |
          schemathesis run "${{ steps.api.outputs.file }}"

  ###########################################################################
  # OWASP ZAP
  ###########################################################################

  zap:
    if: vars.ZAP_TARGET != ''
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: ${{ vars.ZAP_TARGET }}
          rules_file_name: .zap/rules.tsv

  ###########################################################################
  # SECURITY GATE
  ###########################################################################

  security-gate:
    needs:
      - gitleaks
      - semgrep
      - dependency-check
      - trivy-fs

    runs-on: ubuntu-latest

    steps:
      - name: Security Gate
        run: |
          echo "Mandatory security scans completed."
          echo "Security gate passed."