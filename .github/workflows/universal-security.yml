name: Enterprise OWASP Security

on:
  push:
    branches:
      - main
      - master
      - develop

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

jobs:

  detect:
    name: Detect Repository Type
    runs-on: ubuntu-latest

    outputs:
      docker: ${{ steps.detect.outputs.docker }}
      terraform: ${{ steps.detect.outputs.terraform }}
      kubernetes: ${{ steps.detect.outputs.kubernetes }}
      openapi: ${{ steps.detect.outputs.openapi }}

    steps:
      - uses: actions/checkout@v4

      - id: detect
        shell: bash
        run: |
          echo "docker=false" >> $GITHUB_OUTPUT
          echo "terraform=false" >> $GITHUB_OUTPUT
          echo "kubernetes=false" >> $GITHUB_OUTPUT
          echo "openapi=false" >> $GITHUB_OUTPUT

          find . -name Dockerfile | grep -q . && echo "docker=true" >> $GITHUB_OUTPUT

          find . -name "*.tf" | grep -q . && echo "terraform=true" >> $GITHUB_OUTPUT

          find . \( -name "*.yaml" -o -name "*.yml" \) | grep -q . \
            && echo "kubernetes=true" >> $GITHUB_OUTPUT

          find . \( -name "openapi.yaml" -o -name "swagger.yaml" \) | grep -q . \
            && echo "openapi=true" >> $GITHUB_OUTPUT

  semgrep:
    name: OWASP SAST
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            semgrep/semgrep:latest \
            semgrep scan \
            --config p/owasp-top-ten \
            --config p/security-audit \
            /src

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/dependency-review-action@v4

  trivy-filesystem:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Trivy Filesystem
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL

  trivy-container:
    name: Trivy Container Scan
    needs: detect

    if: needs.detect.outputs.docker == 'true'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Container
        run: |
          docker build -t app:${{ github.sha }} .

      - name: Trivy Container
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: app:${{ github.sha }}
          severity: HIGH,CRITICAL

  checkov:
    name: Infrastructure Security
    needs: detect

    if: |
      needs.detect.outputs.terraform == 'true' ||
      needs.detect.outputs.kubernetes == 'true'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Checkov Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform,kubernetes,bicep,cloudformation
          quiet: true

  kubescape:
    name: Kubernetes Security
    needs: detect

    if: needs.detect.outputs.kubernetes == 'true'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Scan Kubernetes Manifests
        run: |
          mkdir -p manifests

          find . \
            -path "./node_modules" -prune -o \
            -path "./.git" -prune -o \
            \( -name "*.yaml" -o -name "*.yml" \) \
            -exec cp {} manifests/ \; || true

          if [ "$(ls -A manifests 2>/dev/null)" ]; then
            docker run --rm \
              -v "$PWD/manifests:/work" \
              kubescape/kubescape:latest \
              scan framework nsa /work
          else
            echo "No Kubernetes manifests found."
          fi

  api-security:
    name: OWASP API Security
    needs: detect

    if: needs.detect.outputs.openapi == 'true'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Schemathesis
        run: |
          python -m pip install --upgrade pip
          pip install schemathesis

      - id: api
        shell: bash
        run: |
          FILE=$(find . \
            \( -name "openapi.yaml" -o -name "swagger.yaml" \) \
            | head -1)

          echo "file=$FILE" >> $GITHUB_OUTPUT

      - name: Run Schemathesis
        run: |
          schemathesis run "${{ steps.api.outputs.file }}"

  security-gate:
    name: Security Gate

    needs:
      - semgrep
      - trivy-filesystem

    runs-on: ubuntu-latest

    steps:
      - run: |
          echo "OWASP security checks completed."
          echo "Security gate passed."