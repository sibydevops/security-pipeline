name: OWASP Enterprise Security

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  ####################################################################
  # SAST
  ####################################################################

  semgrep:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: semgrep/semgrep-action@v1

        with:
          config: |
            p/owasp-top-ten
            p/security-audit

  ####################################################################
  # DEPENDENCY CHECK
  ####################################################################

  dependency-check:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: OWASP Dependency Check

        uses: dependency-check/Dependency-Check_Action@main

        with:
          project: ${{ github.repository }}
          path: .

  ####################################################################
  # TRIVY FILE SYSTEM
  ####################################################################

  trivy:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: aquasecurity/trivy-action@master

        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL

  ####################################################################
  # CHECKOV
  ####################################################################

  checkov:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: bridgecrewio/checkov-action@master

        with:
          directory: .
          framework: terraform,kubernetes,bicep,cloudformation

  ####################################################################
  # API SECURITY
  ####################################################################

  schemathesis:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Install

        run: |
          pip install schemathesis

      - name: Run API Tests

        run: |
          OPENAPI_FILE=$(find . \
            \( -name "openapi.yaml" \
            -o -name "swagger.yaml" \) \
            | head -1)

          if [ -n "$OPENAPI_FILE" ]; then
            schemathesis run "$OPENAPI_FILE"
          fi

  ####################################################################
  # DAST
  ####################################################################

  zap:

    if: vars.ZAP_TARGET != ''

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: OWASP ZAP

        uses: zaproxy/action-baseline@v0.12.0

        with:
          target: ${{ vars.ZAP_TARGET }}

  ####################################################################
  # SECURITY GATE
  ####################################################################

  security-gate:

    needs:
      - semgrep
      - dependency-check
      - trivy

    runs-on: ubuntu-latest

    steps:

      - run: |
          echo "OWASP security scans completed"