name: Organization OWASP Security

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  owasp:
    uses: ./.github/workflows/common-owasp-security.yml
    with:
      # Replace auto with an explicit profile when the repository is onboarded.
      application-type: auto
      target-url: http://127.0.0.1:3000
      openapi-spec: ${{ vars.OWASP_OPENAPI_SPEC }}
      run-zap: true
      start-command: npm install --no-audit --no-fund && npm start
      health-url: http://127.0.0.1:3000/health