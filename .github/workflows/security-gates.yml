name: Organization OWASP Security

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  owasp:
    uses: ./.github/workflows/common-owasp-security.yml
    with:
      # Replace auto with an explicit profile when the repository is onboarded.
      application-type: auto
      target-url: ${{ vars.OWASP_TARGET_URL }}
      openapi-spec: ${{ vars.OWASP_OPENAPI_SPEC }}
      # This repository has no deployed HTTP service. Enable this after supplying
      # an authorized non-production target through OWASP_TARGET_URL.
      run-zap: false