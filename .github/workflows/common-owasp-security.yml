name: Common OWASP Application Security

on:
  workflow_call:
    inputs:
      application-type:
        description: 'auto, web, api, cloud-native, desktop, mobile, library, or infrastructure'
        required: false
        default: auto
        type: string
      target-url:
        description: 'Authorized non-production URL for OWASP ZAP'
        required: false
        default: ''
        type: string
      openapi-spec:
        description: 'Repository path or URL for an API OpenAPI definition'
        required: false
        default: ''
        type: string
      run-zap:
        description: 'Run OWASP ZAP when a target or ephemeral application is available'
        required: false
        default: true
        type: boolean
      start-command:
        description: 'Optional command to start an ephemeral application before ZAP'
        required: false
        default: ''
        type: string
      health-url:
        description: 'Optional health URL for an ephemeral application'
        required: false
        default: ''
        type: string
      upload-codeql-results:
        description: 'Upload CodeQL results to GitHub code scanning'
        required: false
        default: true
        type: boolean
      scan-repository:
        description: 'Repository to scan; defaults to the workflow repository'
        required: false
        default: ''
        type: string
      scan-ref:
        description: 'Git ref or commit SHA to scan; defaults to the workflow ref'
        required: false
        default: ''
        type: string

    secrets:
      scan-token:
        description: 'Token with read access to the target repository and code scanning write access'
        required: false

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  profile:
    name: Identify application profile
    runs-on: ubuntu-latest
    outputs:
      application-type: ${{ steps.detect.outputs.application-type }}
      codeql-language: ${{ steps.detect.outputs.codeql-language }}
      active-test-required: ${{ steps.detect.outputs.active-test-required }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.scan-repository || github.repository }}
          ref: ${{ inputs.scan-ref || github.sha }}
          token: ${{ secrets.scan-token || github.token }}

      - id: detect
        shell: bash
        env:
          REQUESTED_PROFILE: ${{ inputs.application-type }}
        run: |
          profile="$REQUESTED_PROFILE"
          case "$profile" in
            auto)
              if [[ -f Dockerfile || -f compose.yml || -f compose.yaml || -d charts || -d k8s || -d .devcontainer ]]; then
                profile=cloud-native
              elif [[ -f pubspec.yaml || -f AndroidManifest.xml ]] || find . -maxdepth 1 -type f \( -name '*.xcodeproj' -o -name '*.xcworkspace' \) | grep -q .; then
                profile=mobile
              elif find . -type f \( -name '*.sln' -o -name '*.csproj' -o -name '*.xcodeproj' \) -not -path './.git/*' | grep -q .; then
                profile=desktop
              elif [[ -f package.json || -f pom.xml || -d public || -d src ]]; then
                profile=web
              elif [[ -f Cargo.toml || -f go.mod || -f requirements.txt || -f pyproject.toml ]]; then
                profile=library
              else
                profile=infrastructure
              fi
              ;;
            web|api|cloud-native|desktop|mobile|library|infrastructure) ;;
            *) echo "Unsupported application-type: $profile"; exit 1 ;;
          esac

          language=none
          find . -type f -name '*.py' -not -path './.git/*' | grep -q . && language=python
          find . -type f \( -name '*.cs' -o -name '*.csproj' \) -not -path './.git/*' | grep -q . && language=csharp
          find . -type f -name '*.go' -not -path './.git/*' | grep -q . && language=go
          find . -type f \( -name '*.java' -o -name '*.kt' \) -not -path './.git/*' | grep -q . && language=java-kotlin
          find . -type f \( -name '*.js' -o -name '*.jsx' -o -name '*.ts' -o -name '*.tsx' \) -not -path './.git/*' | grep -q . && language=javascript-typescript
          find . -type f -name '*.rb' -not -path './.git/*' | grep -q . && language=ruby
          find . -type f -name '*.swift' -not -path './.git/*' | grep -q . && language=swift

          echo "application-type=$profile" >> "$GITHUB_OUTPUT"
          echo "codeql-language=$language" >> "$GITHUB_OUTPUT"
          echo "active-test-required=true" >> "$GITHUB_OUTPUT"
          {
            echo "## OWASP Security Scan"
            echo "| Field | Value |"
            echo "| --- | --- |"
            printf '| Application repository | `%s` |\n' "$GITHUB_REPOSITORY"
            printf '| Commit | `%s` |\n' "$GITHUB_SHA"
            printf '| Detected profile | `%s` |\n' "$profile"
            printf '| Source language | `%s` |\n' "$language"
            echo "| Source scan | CodeQL when a supported language is detected |"
            echo "| Scan | OWASP ZAP penetration test |"
          } >> "$GITHUB_STEP_SUMMARY"

  sast:
    name: CodeQL source code scanning
    needs: profile
    if: needs.profile.outputs.codeql-language != 'none'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.scan-repository || github.repository }}
          ref: ${{ inputs.scan-ref || github.sha }}
          token: ${{ secrets.scan-token || github.token }}
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ needs.profile.outputs.codeql-language }}
          queries: security-extended
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
        with:
          category: /owasp/${{ needs.profile.outputs.application-type }}
          upload: ${{ inputs.upload-codeql-results }}

  zap:
    name: OWASP ZAP penetration test
    needs: profile
    if: needs.profile.outputs.active-test-required == 'true' && inputs.run-zap == true && (inputs.target-url != '' || inputs.start-command != '' || inputs.openapi-spec != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.scan-repository || github.repository }}
          ref: ${{ inputs.scan-ref || github.sha }}
          token: ${{ secrets.scan-token || github.token }}
      - name: Set up Node.js
        if: inputs.start-command != ''
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Start ephemeral application
        if: inputs.start-command != ''
        shell: bash
        env:
          START_COMMAND: ${{ inputs.start-command }}
          HEALTH_URL: ${{ inputs.health-url }}
        run: |
          nohup bash -c "$START_COMMAND" > app.log 2>&1 &
          echo $! > app.pid
          for attempt in {1..60}; do
            if [[ -z "$HEALTH_URL" ]] || curl --fail --silent "$HEALTH_URL" > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat app.log
          exit 1
      - name: OWASP ZAP API scan
        if: needs.profile.outputs.application-type == 'api' && inputs.openapi-spec != ''
        uses: zaproxy/action-api-scan@v0.10.0
        with:
          target: ${{ inputs.openapi-spec }}
          format: openapi
          allow_issue_writing: false
      - name: OWASP ZAP baseline scan
        if: needs.profile.outputs.application-type != 'api' || inputs.openapi-spec == ''
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ inputs.target-url }}
          cmd_options: '-a'
          allow_issue_writing: false
      - name: Upload OWASP ZAP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-zap-reports-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            report_html.html
            report_json.json
            report_md.md
      - name: Stop ephemeral application
        if: always() && inputs.start-command != ''
        shell: bash
        run: |
          if [[ -f app.pid ]]; then
            kill "$(cat app.pid)" 2>/dev/null || true
          fi

  zap-not-applicable:
    name: OWASP ZAP not applicable
    needs: profile
    if: needs.profile.outputs.active-test-required == 'true' && inputs.run-zap == true && inputs.target-url == '' && inputs.start-command == '' && inputs.openapi-spec == ''
    runs-on: ubuntu-latest
    steps:
      - name: Record active testing status
        shell: bash
        run: |
          echo "No authorized target URL or ephemeral start command was configured."
          echo "OWASP ZAP active testing is not applicable for this run."
          {
            echo "## OWASP ZAP"
            echo "Active testing: not applicable (no target URL or ephemeral application configured)."
          } >> "$GITHUB_STEP_SUMMARY"
