name: Common OWASP Application Security

on:
  workflow_call:
    inputs:
      application-type:
        description: 'auto, web, api, cloud-native, desktop, mobile, library, or infrastructure'
        required: false
        default: auto
        type: string
      target-url:
        description: 'Authorized non-production URL for OWASP ZAP'
        required: false
        default: ''
        type: string
      openapi-spec:
        description: 'Repository path or URL for an API OpenAPI definition'
        required: false
        default: ''
        type: string
      run-zap:
        description: 'Run OWASP ZAP against target-url'
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  security-events: write

jobs:
  profile:
    name: Identify application profile
    runs-on: ubuntu-latest
    outputs:
      application-type: ${{ steps.detect.outputs.application-type }}
      codeql-language: ${{ steps.detect.outputs.codeql-language }}
      active-test-required: ${{ steps.detect.outputs.active-test-required }}
      cloud-native: ${{ steps.detect.outputs.cloud-native }}
    steps:
      - uses: actions/checkout@v4

      - id: detect
        shell: bash
        env:
          REQUESTED_PROFILE: ${{ inputs.application-type }}
        run: |
          profile="$REQUESTED_PROFILE"
          case "$profile" in
            auto)
              if [[ -f Dockerfile || -f compose.yml || -f compose.yaml || -d charts || -d k8s || -d .devcontainer ]]; then
                profile=cloud-native
              elif [[ -f pubspec.yaml || -f AndroidManifest.xml ]] || find . -maxdepth 1 -type f \( -name '*.xcodeproj' -o -name '*.xcworkspace' \) | grep -q .; then
                profile=mobile
              elif find . -type f \( -name '*.sln' -o -name '*.csproj' -o -name '*.xcodeproj' \) -not -path './.git/*' | grep -q .; then
                profile=desktop
              elif [[ -f package.json || -f pom.xml || -d public || -d src ]]; then
                profile=web
              elif [[ -f Cargo.toml || -f go.mod || -f requirements.txt || -f pyproject.toml ]]; then
                profile=library
              else
                profile=infrastructure
              fi
              ;;
            web|api|cloud-native|desktop|mobile|library|infrastructure) ;;
            *) echo "Unsupported application-type: $profile"; exit 1 ;;
          esac

          language=none
          find . -type f -name '*.py' -not -path './.git/*' | grep -q . && language=python
          find . -type f \( -name '*.cs' -o -name '*.csproj' \) -not -path './.git/*' | grep -q . && language=csharp
          find . -type f -name '*.go' -not -path './.git/*' | grep -q . && language=go
          find . -type f \( -name '*.java' -o -name '*.kt' \) -not -path './.git/*' | grep -q . && language=java-kotlin
          find . -type f \( -name '*.js' -o -name '*.jsx' -o -name '*.ts' -o -name '*.tsx' \) -not -path './.git/*' | grep -q . && language=javascript-typescript
          find . -type f -name '*.rb' -not -path './.git/*' | grep -q . && language=ruby
          find . -type f -name '*.swift' -not -path './.git/*' | grep -q . && language=swift

          echo "application-type=$profile" >> "$GITHUB_OUTPUT"
          echo "codeql-language=$language" >> "$GITHUB_OUTPUT"
          [[ "$profile" == web || "$profile" == api || "$profile" == cloud-native ]] && active=true || active=false
          [[ "$profile" == cloud-native ]] && cloud=true || cloud=false
          echo "active-test-required=$active" >> "$GITHUB_OUTPUT"
          echo "cloud-native=$cloud" >> "$GITHUB_OUTPUT"

  dependency:
    name: OWASP Dependency-Check
    needs: profile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dependency-check/Dependency-Check_Action@main
        with:
          project: ${{ github.event.repository.name || github.repository }}
          path: .
          format: SARIF
          out: reports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-dependency-check-${{ github.run_id }}
          path: reports

  sast:
    name: OWASP-aligned source analysis
    needs: profile
    if: needs.profile.outputs.codeql-language != 'none'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ needs.profile.outputs.codeql-language }}
          queries: security-extended
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
        with:
          category: /owasp/${{ needs.profile.outputs.application-type }}

  cloud-native:
    name: Cloud-native configuration and image scan
    needs: profile
    if: needs.profile.outputs.cloud-native == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan repository configuration with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: misconfig,secret,vuln
          format: sarif
          output: trivy-fs.sarif
          severity: HIGH,CRITICAL
          exit-code: '1'
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-fs.sarif

  zap:
    name: OWASP ZAP penetration test
    needs: profile
    if: needs.profile.outputs.active-test-required == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require authorized target
        if: inputs.run-zap == false || inputs.target-url == ''
        run: |
          echo "An authorized non-production target-url is required for ${{ needs.profile.outputs.application-type }}."
          echo "Configure the repository variable OWASP_TARGET_URL or provide an ephemeral deployment."
          exit 1
      - name: OWASP ZAP API scan
        if: needs.profile.outputs.application-type == 'api' && inputs.openapi-spec != ''
        uses: zaproxy/action-api-scan@v0.10.0
        with:
          target: ${{ inputs.openapi-spec }}
          format: openapi
          allow_issue_writing: false
      - name: OWASP ZAP baseline scan
        if: needs.profile.outputs.application-type != 'api' || inputs.openapi-spec == ''
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ inputs.target-url }}
          cmd_options: '-a'
          allow_issue_writing: false

  active-test-status:
    name: Active test applicability
    needs: profile
    if: needs.profile.outputs.active-test-required == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Report not applicable status
        run: |
          echo "OWASP active HTTP penetration testing is not applicable to the ${{ needs.profile.outputs.application-type }} profile."
          echo "Use the profile-specific review plan for desktop, mobile, library, or infrastructure testing."