on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  security-events: write
  actions: read
  contents: read

jobs:
  zap-quick:
    name: Quick ZAP Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'https://staging.yourapp.com'
          cmd_options: '-a'
          fail_action: true

      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-quick-report
          path: report_html.html