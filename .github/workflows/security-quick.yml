name: Security Quick Scan

on:
  pull_request:

permissions:
  contents: read

jobs:

  semgrep:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: semgrep/semgrep-action@v1
        with:
          config: p/owasp-top-ten

  dependency-review:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/dependency-review-action@v4