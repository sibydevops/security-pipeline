name: Organization OWASP Security

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  owasp:
    uses: sibydevops/security-workflows/.github/workflows/common-owasp-security.yml@main
    with:
      application-type: auto
      target-url: ${{ vars.OWASP_TARGET_URL }}
      openapi-spec: ${{ vars.OWASP_OPENAPI_SPEC }}
      run-zap: true
